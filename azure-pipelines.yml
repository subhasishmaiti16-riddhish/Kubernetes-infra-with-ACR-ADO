pool: pipeline-ADO

trigger:
  branches:
    include:
      - feature/*
      - main

stages:

# =========================================================
# 1. Terraform Init + Validate
# =========================================================
- stage: TerraformInitAndValidation
  displayName: Terraform Init And Validation

  jobs:
  - job: TerraformInitAndValidation
    displayName: Terraform Init And Validation

    steps:
    
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.16.4'

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment'
        backendServiceArm: 'azure-pipeline-yaml'
        backendAzureRmResourceGroupName: 'state-file-rg'
        backendAzureRmStorageAccountName: 'statefileaccountfork8s'
        backendAzureRmContainerName: 'statefilestorage'
        backendAzureRmKey: 'kubernetes.statefilestorage'

    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment'


# =========================================================
# 2. Security Scan
# =========================================================
- stage: SecurityScan
  displayName: Security Scan
  dependsOn: TerraformInitAndValidation

  jobs:
  - job: SecurityScan
    displayName: Security Scan

    steps:

    - pwsh: |
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -like "*windows-64bit.zip" }
        if (-not $asset) { throw "Could not find a windows-64bit.zip asset in the latest trivy release." }

        $zip = "$(Agent.TempDirectory)\trivy.zip"
        $dest = "$(Agent.TempDirectory)\trivy"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest -Force
        echo "##vso[task.prependpath]$dest"
      displayName: Install Trivy

    - pwsh: |
        trivy config "$(System.DefaultWorkingDirectory)/Environment" --exit-code 1 --severity HIGH,CRITICAL
      displayName: Run Trivy Scan


# =========================================================
# 3. Terraform Plan
# =========================================================
- stage: TerraformPlan
  displayName: Terraform Plan
  dependsOn: SecurityScan

  jobs:
  - job: TerraformPlan
    displayName: Terraform Plan

    steps:

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment'
        backendServiceArm: 'azure-pipeline-yaml'
        backendAzureRmResourceGroupName: 'state-file-rg'
        backendAzureRmStorageAccountName: 'statefileaccountfork8s'
        backendAzureRmContainerName: 'statefilestorage'
        backendAzureRmKey: 'kubernetes.statefilestorage'

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment'
        environmentServiceNameAzureRM: 'azure-pipeline-yaml'


# =========================================================
# 4. Terraform Apply - ONLY on main
# =========================================================
- stage: TerraformApply
  displayName: Terraform Apply
  dependsOn: TerraformPlan

  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: TerraformApply
    displayName: Terraform Apply

    steps:

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment'
        backendServiceArm: 'azure-pipeline-yaml'
        backendAzureRmResourceGroupName: 'state-file-rg'
        backendAzureRmStorageAccountName: 'statefileaccountfork8s'
        backendAzureRmContainerName: 'statefilestorage'
        backendAzureRmKey: 'kubernetes.statefilestorage'

    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Environment'
        environmentServiceNameAzureRM: 'azure-pipeline-yaml'